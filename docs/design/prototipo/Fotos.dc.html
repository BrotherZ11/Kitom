<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gestión de fotos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kitom.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}

</style>
</helmet>
<div class="app">
  <div class="scr" style="gap: 18px">
    <div class="top"><a class="ib" href="Ajustes.dc.html" aria-label="Volver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><span class="strong">Fotos</span><span style="width: 44px"></span></div>
    <div class="seg three" role="tablist" aria-label="Tipo de foto">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button class="{{t.cls}}" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><a class="photo" href="#foto-0" style="aspect-ratio: 1; border-radius: 12px; text-decoration: none" aria-label="14 oct"><span>14 oct</span></a><a class="photo" href="#foto-1" style="aspect-ratio: 1; border-radius: 12px; text-decoration: none" aria-label="2 oct"><span>2 oct</span></a><a class="photo" href="#foto-2" style="aspect-ratio: 1; border-radius: 12px; text-decoration: none" aria-label="21 sep"><span>21 sep</span></a><a class="photo" href="#foto-3" style="aspect-ratio: 1; border-radius: 12px; text-decoration: none" aria-label="12 ago"><span>12 ago</span></a><a class="photo" href="#foto-4" style="aspect-ratio: 1; border-radius: 12px; text-decoration: none" aria-label="30 jul"><span>30 jul</span></a><a class="photo" href="#foto-5" style="aspect-ratio: 1; border-radius: 12px; text-decoration: none" aria-label="9 jul"><span>9 jul</span></a></div>
    <p class="cap muted">Tus fotos son privadas. Solo se muestran dentro de Kitom con enlaces temporales.</p>
    <a class="btn ghost md" href="#borrar" style="color: var(--danger-ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Borrar las fotos de las consultas</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {"tab": "ai"};
  }
  renderVals() {
    const tabs = [['pet', 'Kika'], ['ai', 'Consultas'], ['agenda', 'Agenda']];
    return { tabs: tabs.map((t) => ({ label: t[1], on: this.state.tab === t[0], cls: this.state.tab === t[0] ? 'on' : '', pick: () => this.setState({ tab: t[0] }) })) };
  }
}
</script>
</body>
</html>
