<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">

<div class="app">
  <div class="scr" style="gap: 20px; padding-top: 54px">
    <div class="top">
      <a class="ib" href="PerfilMascota.dc.html" aria-label="Volver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <span class="strong">Perfil de Kika</span>
      <span class="data muted" style="width: 44px; text-align: right">6/9</span>
    </div>
    <div class="row" style="gap: 16px">
      <a href="FotoHoja.dc.html" class="av s64 warm" aria-label="Cambiar la foto" style="text-decoration: none">K</a>
      <div class="field grow"><label for="pn">Nombre</label><input id="pn" class="input" type="text" value="Kika"></div>
    </div>
    <p class="muted">Todo es opcional. Cuanto más sepamos de Kika, mejor se ajustan sus tendencias y orientaciones.</p>
    <div class="field">
      <label for="br">Raza</label>
      <a class="input" id="br" href="#razas" style="justify-content: space-between; text-decoration: none; color: inherit">Mestiza<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></a>
      <p class="help">Elige del catálogo, escribe la suya, «mestiza» o «no lo sé».</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div class="field"><label for="bd">Nacimiento</label><input id="bd" class="input mono" type="text" value="03/2021"></div>
      <div class="field"><label for="wt">Peso</label><input id="wt" class="input mono" type="text" value="12,4 kg"></div>
    </div>
    <div class="field"><span class="flabel" id="sexo">Sexo</span><div class="seg three" role="radiogroup" aria-labelledby="sexo"><button class="on" role="radio" aria-checked="true">Hembra</button><button class="" role="radio" aria-checked="false">Macho</button><button class="" role="radio" aria-checked="false">No lo sé</button></div></div>
    <div class="field"><span class="flabel" id="esterilizada">Esterilizada</span><div class="seg three" role="radiogroup" aria-labelledby="esterilizada"><button class="on" role="radio" aria-checked="true">Sí</button><button class="" role="radio" aria-checked="false">No</button><button class="" role="radio" aria-checked="false">No lo sé</button></div></div>
    <div class="field"><label for="al">Alergias <span style="font-weight: 400; color: var(--muted)">· opcional</span></label><input id="al" class="input" type="text" placeholder="Por ejemplo, pollo o pulgas"></div>
    <div class="field"><label for="kc">Enfermedades conocidas <span style="font-weight: 400; color: var(--muted)">· opcional</span></label><input id="kc" class="input" type="text" placeholder="Las que te haya dicho tu veterinario"></div>
    <div class="field"><label for="ch">Su carácter <span style="font-weight: 400; color: var(--muted)">· opcional</span></label><textarea id="ch" class="input" placeholder="Cómo es en casa, qué le asusta, qué le encanta"></textarea></div>
    <hr class="divider">
    <a class="btn ghost md" href="EliminarMascota.dc.html" style="color: var(--danger-ink)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Eliminar a Kika de Kitom</a>
  </div>
  <div class="foot"><a class="btn primary" href="PerfilGuardado.dc.html">Guardar cambios</a></div>
</div>
