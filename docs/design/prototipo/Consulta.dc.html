<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Consultar · señales</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kitom.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}

</style>
</helmet>
<div class="app">
  <div class="scr" style="gap: 20px">
    <div class="top"><a class="ib" href="ConsultaIntro.dc.html" aria-label="Volver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div class="col" style="gap: 0; align-items: center; text-align: center"><span class="strong">Consultar</span><span class="cap muted">Kika</span></div><span class="data muted" style="width: 44px; text-align: right">2/3</span></div>
    <div class="card flat" style="flex-direction: row; align-items: center; gap: 12px">
      <div class="thumb photo" role="img" aria-label="Foto añadida"></div>
      <div class="col grow" style="gap: 0"><span class="strong">Foto añadida</span><span class="cap muted">Ojo derecho</span></div>
      <a class="btn secondary sm" href="ConsultaFoto.dc.html">Cambiar</a>
    </div>
    <div class="col" style="gap: 10px">
      <h2 class="t3">¿Qué ves?</h2>
      <div class="chips">
        <sc-for list="{{symptoms}}" as="c" hint-placeholder-count="6"><button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.toggle}}">{{c.label}}</button></sc-for>
      </div>
      <p class="cap muted">Señales revisadas por nuestro veterinario colaborador para perros y gatos.</p>
    </div>
    <div class="field">
      <label for="desc">Cuéntanos más <span style="font-weight: 400; color: var(--muted)">· opcional</span></label>
      <textarea id="desc" class="input">Desde ayer tiene el ojo derecho lloroso y se lo frota con la pata.</textarea>
      <p class="help">Desde cuándo, si ha cambiado algo en casa, si come y bebe.</p>
    </div>
  </div>
  <div class="foot">
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}"><a class="btn primary" href="ConsultaRevision.dc.html">Revisar y enviar</a></sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}"><span class="btn disabled" aria-disabled="true">Elige al menos una señal</span></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {"on": {"watery_eyes": true}};
  }
  renderVals() {
    const list = [['watery_eyes', 'Ojos llorosos'], ['limping', 'Cojera'], ['lethargy', 'Decaimiento'], ['wound', 'Heridas visibles'], ['appetite_loss', 'Falta de apetito'], ['excessive_vocal', 'Vocalización excesiva']];
    const symptoms = list.map((c) => { const on = !!this.state.on[c[0]]; return { label: c[1], on, cls: on ? 'chip on' : 'chip',
      toggle: () => this.setState({ on: { ...this.state.on, [c[0]]: !on } }) }; });
    const n = symptoms.filter((s) => s.on).length;
    return { symptoms, ready: n > 0, notReady: n === 0 };
  }
}
</script>
</body>
</html>
