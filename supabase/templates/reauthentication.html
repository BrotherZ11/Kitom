<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Tu código de seguridad</title>
</head>
<body style="margin:0;padding:0;background:#F2F5F3;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F5F3;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:#0E3B39;padding:20px 28px;color:#FFFFFF;font-size:22px;font-weight:600;letter-spacing:0.3px;">Kitom</td>
          </tr>
          <tr>
            <td style="padding:28px;">
          <h1 style="margin:0 0 16px;font-size:22px;line-height:28px;color:#0E3B39;">Tu código de seguridad</h1>
          <p style="margin:0 0 16px;font-size:16px;line-height:24px;color:#22302E;">Escribe este código en Kitom para confirmar que eres tú:</p>
          <p style="margin:24px 0;padding:16px;background:#F2F5F3;border-radius:12px;font-family:Consolas,Menlo,monospace;font-size:28px;letter-spacing:6px;text-align:center;color:#0E3B39;">{{ .Token }}</p>
          <p style="margin:0 0 8px;font-size:13px;line-height:20px;color:#5B6B68;">Si no lo has pedido tú, ignora este correo y cambia tu contraseña.</p>
          <hr style="border:0;border-top:1px solid #E1E7E4;margin:24px 0 16px;">
          <p style="margin:0 0 8px;font-size:13px;line-height:20px;color:#5B6B68;">Enter this code in Kitom to confirm it’s you. If you didn’t ask for it, ignore this email and change your password.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
