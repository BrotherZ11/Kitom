# Publica las páginas públicas de Kitom (carpeta site/) en GitHub Pages.
# Requisito: Settings › Pages › Build and deployment › Source = «GitHub Actions» (ver site/README.md).
# Versiones fijadas con tag exacto: actualizarlas a propósito, nunca con un @vN flotante.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Subida y despliegue en jobs separados: en el mismo job, deploy-pages a veces busca el artefacto
# «github-pages» antes de que aparezca en la lista de la ejecución y falla con «No artifacts named
# "github-pages" were found» (actions/deploy-pages#451). Con `needs`, el job deploy solo empieza cuando
# build ha terminado y el artefacto ya está listado.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5
